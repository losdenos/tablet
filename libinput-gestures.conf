# ~/.config/libinput-gestures.conf
# Swipe gestures for the Fujitsu Arrows Tab V727
# Requires: libinput-gestures (AUR), xdotool
# Install:  yay -S libinput-gestures xdotool
# Enable:   libinput-gestures-setup autostart start
# Add user to input group: sudo gpasswd -a $USER input

# ── 3-finger swipes ────────────────────────────────────────────────────────

# Swipe up → open dashboard hub
gesture swipe up   3  _internal --shortcut super+space

# Swipe down → toggle on-screen keyboard
gesture swipe down 3  _internal --shortcut super+k

# Swipe left → next i3 workspace
gesture swipe left  3  _internal --shortcut super+Right

# Swipe right → previous i3 workspace
gesture swipe right 3  _internal --shortcut super+Left

# ── 4-finger swipes ────────────────────────────────────────────────────────

# Swipe up → show quick controls
gesture swipe up   4  _internal --shortcut super+q

# Swipe down → power menu
gesture swipe down 4  _internal --shortcut super+p

# Swipe left → close focused window
gesture swipe left  4  _internal --shortcut super+shift+q

# Swipe right → fullscreen toggle
gesture swipe right 4  _internal --shortcut super+f

# ── Pinch ──────────────────────────────────────────────────────────────────
# Pinch in/out → zoom (browser only; browser handles this natively)
# gesture pinch in   2  _internal --shortcut ctrl+minus
# gesture pinch out  2  _internal --shortcut ctrl+equal
