# ~/.config/i3/i3status.conf
# Clean status bar for tablet

general {
    colors = true
    interval = 3
    color_good     = "#a6e3a1"
    color_degraded = "#f9e2af"
    color_bad      = "#f38ba8"
}

order += "wireless _first_"
order += "battery all"
order += "cpu_usage"
order += "memory"
order += "volume master"
order += "disk /"
order += "tztime local"

wireless _first_ {
    format_up   = " %essid %quality"
    format_down = " offline"
}

battery all {
    format         = "%status %percentage"
    format_down    = " no battery"
    status_chr     = " "
    status_bat     = " "
    status_unk     = "? "
    status_full    = " "
    path           = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold  = 20
    threshold_type = percentage
}

cpu_usage {
    format = " %usage"
}

memory {
    format         = " %used"
    threshold_degraded = "1G"
    format_degraded = " LOW"
}

volume master {
    format       = " %volume"
    format_muted = " muted"
    device       = "default"
    mixer        = "Master"
    mixer_idx    = 0
}

disk "/" {
    format = " %avail"
}

tztime local {
    format = " %a %d %b   %H:%M"
}
