# ~/.config/picom/picom.conf
# Clean, lightweight — no heavy blur (saves GPU on tablet)

# ── Shadows ───────────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Rounded corners ───────────────────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ── Fading ────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# ── Opacity ───────────────────────────────────────────────────────
inactive-opacity = 0.93;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'soffice'",
    "95:class_g = 'Alacritty'",
    "100:class_g = 'Rofi'"
];

# ── Backend ───────────────────────────────────────────────────────
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";
